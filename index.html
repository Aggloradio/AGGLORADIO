<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">

<title>AGGLORADIO - Votre radio en direct</title>

<meta name="description" content="Votre webradio votre musique ! Écoutez AGGLORADIO en direct.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        linear-gradient(rgba(5, 10, 25, 0.82), rgba(5, 10, 25, 0.90)),
        url("https://images.unsplash.com/photo-1734383172782-d57707506342?auto=format&fit=crop&fm=jpg&q=85&w=3000")
        center center / cover fixed no-repeat;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: rgba(0,0,0,0.45);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo {
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffffff;
    text-shadow: 0 0 20px #008cff;
}

.logo span {
    color: #00aaff;
}

header p {
    margin-top: 10px;
    color: #b9c9df;
    font-size: 15px;
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 15px;
}

.player {
    width: 100%;
    max-width: 460px;
    background: rgba(10, 17, 34, 0.94);
    border: 1px solid rgba(0,170,255,0.4);
    border-radius: 25px;
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 0 35px rgba(0,140,255,0.25);
}

.radio-icon {
    width: 135px;
    height: 135px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: linear-gradient(145deg, #007bff, #00d4ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    box-shadow: 0 0 30px rgba(0,170,255,0.45);
}

.player h1 {
    font-size: 27px;
    margin-bottom: 8px;
}

.subtitle {
    color: #a9bdd7;
    font-size: 14px;
    margin-bottom: 25px;
}

/* HORLOGE NUMERIQUE */

.clock {
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #00baff;
    text-shadow: 0 0 15px rgba(0,170,255,0.5);
    margin: 15px 0 5px;
    font-variant-numeric: tabular-nums;
}

.date {
    color: #b9c9df;
    font-size: 14px;
    text-transform: capitalize;
    margin-bottom: 20px;
}

audio {
    width: 100%;
    margin: 10px 0 20px;
    height: 45px;
}

.play-button {
    border: none;
    background: linear-gradient(90deg, #007bff, #00c8ff);
    color: white;
    font-size: 17px;
    font-weight: bold;
    padding: 16px 35px;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.3s;
    width: 100%;
}

.play-button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 25px rgba(0,170,255,0.5);
}

.status {
    margin-top: 20px;
    color: #9fb4ce;
    font-size: 13px;
    min-height: 18px;
}

.equalizer {
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    margin: 20px 0;
}

.equalizer span {
    width: 5px;
    height: 12px;
    border-radius: 5px;
    background: #00baff;
}

.equalizer.active span {
    animation: equalize 0.7s infinite ease-in-out alternate;
}

.equalizer span:nth-child(2n) {
    animation-delay: .2s;
}

.equalizer span:nth-child(3n) {
    animation-delay: .4s;
}

@keyframes equalize {
    from { height: 8px; }
    to { height: 40px; }
}

/* PARTENAIRE STELLAR MEDIA */

.partner {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.12);
    color: #b9c9df;
    font-size: 14px;
}

.partner img {
    display: block;
    width: 150px;
    max-width: 80%;
    height: auto;
    max-height: 75px;
    object-fit: contain;
    margin: 12px auto 0;
    background: white;
    border-radius: 5px;
    padding: 5px;
}

/* POCHETTE ET TITRE DU MORCEAU */

.now-playing {
    margin: 20px 0;
    padding: 15px;
    background: rgba(0, 140, 255, 0.08);
    border: 1px solid rgba(0, 170, 255, 0.25);
    border-radius: 15px;
}

.album-cover {
    width: 190px;
    height: 190px;
    object-fit: cover;
    border-radius: 15px;
    margin: 0 auto 15px;
    display: block;
    box-shadow: 0 0 25px rgba(0,170,255,0.3);
}

.track-title {
    color: #ffffff;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

.track-artist {
    color: #00baff;
    font-size: 14px;
}

.track-label {
    color: #9fb4ce;
    font-size: 12px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

footer {
    text-align: center;
    padding: 22px 15px;
    color: #8298b5;
    font-size: 13px;
    background: rgba(0,0,0,0.65);
    line-height: 1.9;
}

footer strong {
    color: #00baff;
}

footer a {
    color: #00baff;
    text-decoration: none;
}

footer a:hover {
    text-decoration: underline;
}

@media(max-width:480px) {
    .player {
        padding: 25px 18px;
    }

    .radio-icon {
        width: 110px;
        height: 110px;
        font-size: 52px;
    }

    .clock {
        font-size: 30px;
    }

    body {
        background-attachment: scroll;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AGGLO<span>RADIO</span></div>
    <p>Votre webradio votre musique!</p>
</header>

<main>

<section class="player">

    <div class="radio-icon">🎙️</div>

    <h1>AGGLORADIO</h1>

    <p class="subtitle">
        Écoutez votre webradio en direct
    </p>

    <!-- POCHETTE ET MORCEAU EN COURS -->

    <div class="now-playing">

        <div class="track-label">🎵 ACTUELLEMENT SUR AGGLORADIO</div>

        <img
            id="albumCover"
            class="album-cover"
            src="https://placehold.co/400x400/09172b/00baff?text=AGGLORADIO"
            alt="Pochette du morceau">

        <div class="track-title" id="trackTitle">
            En attente du morceau...
        </div>

        <div class="track-artist" id="trackArtist">
            AGGLORADIO
        </div>

    </div>

    <!-- HORLOGE ET DATE -->

    <div class="clock" id="clock">00:00:00</div>
    <div class="date" id="date"></div>

    <!-- EGALISEUR ANIME -->

    <div class="equalizer" id="equalizer">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

    <!-- LECTEUR RADIO -->

    <audio id="radio" preload="none">
        <source
            src="https://s3.free-shoutcast.com/stream/18122"
            type="audio/mpeg">
        Votre navigateur ne supporte pas la lecture audio.
    </audio>

    <button class="play-button" id="playButton">
        ▶ ÉCOUTER AGGLORADIO
    </button>

    <p class="status" id="status" aria-live="polite"></p>

    <!-- PARTENAIRE STELLAR MEDIA -->

    <div class="partner">
        Avec notre partenaire:

        <img
            src="stellar-media.png.png"
            alt="Logo Stellar Media">
    </div>

</section>

</main>

<footer>
    <strong>AGGLORADIO</strong><br>

    Pour tout contact ou suggestion :<br>

    <a href="mailto:aggloradio@mail.com">
        aggloradio@mail.com
    </a>

    <br>
    © <span id="year"></span> AGGLORADIO - Tous droits réservés
</footer>

<script>
const radio = document.getElementById("radio");
const button = document.getElementById("playButton");
const status = document.getElementById("status");
const equalizer = document.getElementById("equalizer");

// ANNEE

document.getElementById("year").textContent =
    new Date().getFullYear();

// HORLOGE NUMERIQUE

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString("fr-FR", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString("fr-FR", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
}

updateClock();
setInterval(updateClock, 1000);

// LECTEUR RADIO

button.addEventListener("click", async () => {

    if (radio.paused) {

        status.textContent = "Connexion à AGGLORADIO...";

        try {
            await radio.play();
        } catch (error) {
            status.textContent =
                "Impossible de démarrer le flux. Réessayez.";
        }

    } else {
        radio.pause();
    }

});

radio.addEventListener("playing", () => {
    button.textContent = "⏸ METTRE EN PAUSE";
    status.textContent = "Vous écoutez AGGLORADIO !";
    equalizer.classList.add("active");
});

radio.addEventListener("pause", () => {
    button.textContent = "▶ ÉCOUTER AGGLORADIO";
    status.textContent = "Lecture en pause";
    equalizer.classList.remove("active");
});

radio.addEventListener("waiting", () => {
    status.textContent = "Chargement du flux audio...";
});

radio.addEventListener("error", () => {
    status.textContent =
        "Flux momentanément indisponible. Réessayez.";
    equalizer.classList.remove("active");
});

// ======================================
// TITRE ET POCHETTE DU MORCEAU EN COURS
// ======================================

const albumCover = document.getElementById("albumCover");
const trackTitle = document.getElementById("trackTitle");
const trackArtist = document.getElementById("trackArtist");

let lastTrack = "";

async function updateNowPlaying() {

    try {

        // Récupération des informations SHOUTcast

        const response = await fetch(
            "https://s3.free-shoutcast.com/stats?sid=1&json=1&t=" + Date.now()
        );

        if (!response.ok) return;

        const data = await response.json();

        const song = data.songtitle || data.song || data.title;

        if (!song || song === lastTrack) return;

        lastTrack = song;

        // Séparation artiste et titre

        let artist = "";
        let title = song;

        if (song.includes(" - ")) {
            const parts = song.split(" - ");
            artist = parts.shift().trim();
            title = parts.join(" - ").trim();
        }

        trackTitle.textContent = title;
        trackArtist.textContent = artist || "AGGLORADIO";

        // Recherche de la pochette

        const search = artist
            ? artist + " " + title
            : title;

        const artworkResponse = await fetch(
            "https://itunes.apple.com/search?term=" +
            encodeURIComponent(search) +
            "&entity=song&limit=1"
        );

        const artworkData = await artworkResponse.json();

        if (artworkData.results && artworkData.results.length > 0) {

            albumCover.src =
                artworkData.results[0].artworkUrl100
                .replace("100x100bb", "600x600bb");

        } else {

            albumCover.src =
                "https://placehold.co/400x400/09172b/00baff?text=AGGLORADIO";
        }

    } catch (error) {

        console.log("Informations du morceau indisponibles", error);

    }
}

// Actualisation toutes les 15 secondes

updateNowPlaying();
setInterval(updateNowPlaying, 15000);

// Image de remplacement si la pochette est introuvable

albumCover.addEventListener("error", () => {
    albumCover.src =
        "https://placehold.co/400x400/09172b/00baff?text=AGGLORADIO";
});

</script>

</body>
</html>
