<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGGLORADIO - Radio en direct</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#080d19,#172c4b,#101522);
  color: white;
  text-align: center;
}

header {
  padding: 40px 15px;
  background: #080d19;
}

header h1 {
  color: #ffca28;
  font-size: 45px;
  letter-spacing: 5px;
  margin: 0;
}

header p {
  color: #ccc;
  font-size: 17px;
}

main {
  padding: 45px 15px;
}

.player {
  max-width: 500px;
  margin: 30px auto;
  padding: 35px 25px;
  border-radius: 22px;
  background: #23344f;
  box-shadow: 0 10px 35px #0008;
}

.live {
  color: #ff5555;
  font-weight: bold;
  letter-spacing: 3px;
}

.play {
  background: #ffca28;
  color: #111;
  border: none;
  padding: 16px 30px;
  border-radius: 40px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin: 20px 0;
}

.play:hover {
  background: white;
}

audio {
  width: 100%;
}

#status {
  color: #ddd;
  font-size: 14px;
  margin-top: 18px;
}

footer {
  padding: 25px;
  background: #080d19;
  color: #aaa;
}

</style>
</head>

<body>

<header>
  <h1>AGGLORADIO</h1>
  <p>Votre radio, votre musique, votre région !</p>
</header>

<main>

  <h2>Bienvenue sur AGGLORADIO</h2>
  <p>La radio qui vous accompagne partout dans le monde.</p>

  <div class="player">

    <p class="live">● EN DIRECT</p>

    <h2>ÉCOUTEZ AGGLORADIO</h2>

    <button class="play" id="playButton">
      ▶ ÉCOUTER EN DIRECT
    </button>

    <audio id="radio" controls preload="none">
      <source
        src="https://uk21freenew.listen2myradio.com/live.mp3?typeportmount=s1_20916_stream_579992880"
        type="audio/mpeg">
    </audio>

    <p id="status">AGGLORADIO est prête à vous accueillir.</p>

  </div>

</main>

<footer>
  © 2026 AGGLORADIO - Tous droits réservés
</footer>

<script>

const radio = document.getElementById("radio");
const button = document.getElementById("playButton");
const status = document.getElementById("status");

button.addEventListener("click", async () => {

  if (radio.paused) {

    status.textContent = "Connexion à AGGLORADIO...";

    try {
      await radio.play();
      button.textContent = "❚❚ METTRE EN PAUSE";
    } catch (error) {
      status.textContent = "Impossible de lire le flux. Réessayez.";
    }

  } else {

    radio.pause();
    button.textContent = "▶ ÉCOUTER EN DIRECT";
    status.textContent = "Lecture en pause.";

  }

});

radio.addEventListener("playing", () => {
  status.textContent = "Vous écoutez AGGLORADIO en direct !";
});

radio.addEventListener("error", () => {
  status.textContent = "Erreur de connexion au flux audio.";
});

radio.addEventListener("pause", () => {
  button.textContent = "▶ ÉCOUTER EN DIRECT";
});

</script>

</body>
</html>
